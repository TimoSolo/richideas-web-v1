name = "richideas-forms"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Plain-text settings. Secrets (RESEND_API_KEY) are set with `wrangler secret put`.
[vars]
# Origins allowed to post to this worker, comma separated. Add the Pages URL and the live domain.
ALLOWED_ORIGINS = "https://timosolo.me,https://richideas.co.za,https://www.richideas.co.za,http://127.0.0.1:8765,http://localhost:8765"
# Where submissions go. Per-form overrides: TO_FREE_WILL, TO_REVIEW, TO_QUESTIONS, TO_CONTACT, TO_BOOK_A_MEETING.
TO_EMAIL = "hello@richideas.co.za"
# Must be on a domain verified in Resend.
FROM_EMAIL = "Rich Ideas website <website@richideas.co.za>"
# Max submissions per IP per hour (only enforced when the KV binding below exists).
RATE_LIMIT = "10"

# Optional: keep a copy of every submission and enable rate limiting.
# Create with `wrangler kv namespace create FORMS` and paste the id here.
# [[kv_namespaces]]
# binding = "FORMS"
# id = "..."

# Optional: serve on your own hostname instead of *.workers.dev
# routes = [{ pattern = "forms.richideas.co.za", custom_domain = true }]
